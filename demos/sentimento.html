<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análise de sentimento · Web AI</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#1f2937}
 h1{font-size:1.6rem} textarea,input{width:100%;padding:10px;font-size:1rem;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}
 button{margin-top:10px;padding:10px 18px;font-size:1rem;border:0;border-radius:8px;background:#4f46e5;color:#fff;cursor:pointer}
 button:disabled{background:#94a3b8} pre{background:#f1f5f9;padding:12px;border-radius:8px;white-space:pre-wrap}
 a{color:#4f46e5}
</style>
</head>
<body>
<p><a href="index.html">← demos</a></p>
<h1>Análise de sentimento</h1>
<p>Modelo rodando 100% no seu navegador com Transformers.js. Nenhum dado sai da sua máquina.</p>
<textarea id="txt" rows="4">O atendimento foi rápido e resolveu meu problema!</textarea>
<button id="btn">Executar</button>
<pre id="out">Carregue e execute…</pre>
<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3";
const out = document.getElementById("out"), btn = document.getElementById("btn");
let modelo;
btn.onclick = async () => {
  btn.disabled = true;
  try {
    if (!modelo) { out.textContent = "Baixando modelo (só na primeira vez)…"; modelo = await pipeline("sentiment-analysis", "Xenova/bert-base-multilingual-uncased-sentiment"); }
    out.textContent = "Processando…";
    const r = await modelo(document.getElementById("txt").value);
    out.textContent = `Resultado: ${r[0].label} (confiança ${(r[0].score*100).toFixed(1)}%)\n1 star = muito negativo · 5 stars = muito positivo`;
  } catch (e) { out.textContent = "Erro: " + e.message; }
  btn.disabled = false;
};
</script>
</body>
</html>
